# docker-compose.yml
# Εκτέλεση:  docker compose up -d --build
# Τερματισμός: docker compose down
services:
  nginx:
    container_name: nginx
    build: ./docker/nginx
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./src:/var/www/html

  php:
    container_name: php
    build: ./docker/php
    depends_on:
      mysql:
        condition: service_healthy
    # Η θύρα 9000 (PHP-FPM) χρειάζεται μόνο εσωτερικά για το nginx,
    # γι' αυτό δεν τη "δημοσιεύουμε" στον host.
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html

  mysql:
    image: mysql:8.4
    container_name: mysql
    env_file:
      - ./env/mysql.env
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: pma
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 64M
    restart: always
    ports:
      - "8085:80"
